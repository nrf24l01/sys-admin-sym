services:
  website:
    image: ghcr.io/nrf24l01/sys-admin-sym-website:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DOWNLOAD_BASE_URL: ${DOWNLOAD_BASE_URL:?Set DOWNLOAD_BASE_URL in website/.env}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - website-net

networks:
  website-net:
    driver: bridge
