name: Build game

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Cross.toml
      - crates/**
      - assets/**
      - tools/package_game.py
      - tools/test_package_game.py
      - .github/workflows/build-game.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test workspace and package
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Cache Cargo dependencies and test build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Test portable ZIP packaging
        run: python3 -m unittest discover -s tools -p test_package_game.py

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            extension: .exe
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Cache Cargo dependencies and release build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cross
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install cross
        if: runner.os == 'Linux'
        run: |
          if ! command -v cross >/dev/null; then
            cargo install cross --locked --version 0.2.5
          fi
      - name: Set up native Windows toolchain
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build Linux release game and terminal client
        if: runner.os == 'Linux'
        run: cross build --release --locked --target ${{ matrix.target }} -p cloud-provider-game -p game-ssh --bins
      - name: Build Windows release game and terminal client
        if: runner.os == 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }} -p cloud-provider-game -p game-ssh --bins
      - name: Smoke test Linux game under X11
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers libvulkan1 libx11-6 libxrandr2 libxcursor1 libxi6 libxkbcommon-x11-0
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lvp_icd" ]; then
            echo 'Mesa Lavapipe Vulkan driver manifest was not installed' >&2
            exit 1
          fi
          echo "Using software Vulkan driver: $lvp_icd"
          set +e
          timeout 30s xvfb-run -a env WGPU_BACKEND=vulkan \
            VK_DRIVER_FILES="$lvp_icd" \
            target/${{ matrix.target }}/release/cloud-provider-sim > linux-smoke.log 2>&1 &
          smoke_pid=$!
          connected=0
          for attempt in {1..20}; do
            if GAME_SSH_PASSWORD=game target/${{ matrix.target }}/release/game-ssh --list > console-smoke.log 2>&1; then
              connected=1
              break
            fi
            if ! kill -0 "$smoke_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          wait "$smoke_pid"
          status=$?
          set -e
          cat linux-smoke.log
          cat console-smoke.log
          if [ "$connected" -ne 1 ]; then
            echo 'Terminal client could not connect to the Linux game' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Linux game exited with status $status during launch" >&2
            exit 1
          fi
          if grep -q 'panicked at' linux-smoke.log; then
            echo 'Linux game panicked during launch' >&2
            exit 1
          fi
      - name: Verify Windows executable needs no bundled runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'Visual Studio C++ tools were not found' }
          $tools = Get-ChildItem "$installation/VC/Tools/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = "$($tools.FullName)/bin/Hostx64/x64/dumpbin.exe"
          foreach ($binary in @('cloud-provider-sim.exe', 'game-ssh.exe')) {
            $imports = & $dumpbin /DEPENDENTS "target/${{ matrix.target }}/release/$binary"
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect $binary" }
            $imports | Write-Output
            if ($imports -match '(?i)(libgcc|libstdc\+\+|libwinpthread|vcruntime|msvcp|msvcr)[^\s]*\.dll') {
              throw "Unexpected runtime DLL dependency in $binary"
            }
          }
      - name: Smoke test Windows terminal client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/game-ssh.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Windows terminal client failed to start' }
      - name: Package executable, assets, and instructions
        run: >-
          python tools/package_game.py
          --executable target/${{ matrix.target }}/release/cloud-provider-sim${{ matrix.extension }}
          --terminal target/${{ matrix.target }}/release/game-ssh${{ matrix.extension }}
          --assets assets
          --readme README.md
          --output dist/cloud-provider-sim-${{ matrix.target }}.zip
      - name: Upload shareable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: game-${{ matrix.target }}
          path: dist/cloud-provider-sim-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 30
