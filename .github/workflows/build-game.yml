name: Build game

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Cross.toml
      - Makefile
      - AGENTS.md
      - README.md
      - crates/**
      - assets/**
      - tools/**
      - .github/workflows/build-game.yml
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Cross.toml
      - Makefile
      - AGENTS.md
      - README.md
      - crates/**
      - assets/**
      - tools/**
      - .github/workflows/build-game.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run complete Make verification
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Cache Cargo dependencies and test build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install validation tools and software renderer
        run: |
          rustup component add rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y make python3 xvfb xauth mesa-vulkan-drivers libvulkan1 libx11-6 libxrandr2 libxcursor1 libxi6 libxkbcommon-x11-0
      - name: Run all checks
        run: make check
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-startup-logs
          path: target/check-logs/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            extension: .exe
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Cache Cargo dependencies and release build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cross
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install cross
        if: runner.os == 'Linux'
        run: |
          if ! command -v cross >/dev/null; then
            cargo install cross --locked --version 0.2.5
          fi
      - name: Set up native Windows toolchain
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build Linux release game and terminal client
        if: runner.os == 'Linux'
        run: cross build --release --locked --target ${{ matrix.target }} -p cloud-provider-game -p game-ssh --bins
      - name: Build Windows release game and terminal client
        if: runner.os == 'Windows'
        run: cargo build --release --locked --target ${{ matrix.target }} -p cloud-provider-game -p game-ssh --bins
      - name: Smoke test Linux game under X11
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers libvulkan1 libx11-6 libxrandr2 libxcursor1 libxi6 libxkbcommon-x11-0
          make smoke-built \
            GAME=target/${{ matrix.target }}/release/cloud-provider-sim \
            CLIENT=target/${{ matrix.target }}/release/game-ssh \
            CHECK_LOGS=target/release-check-logs
      - name: Verify Windows executable needs no bundled runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'Visual Studio C++ tools were not found' }
          $tools = Get-ChildItem "$installation/VC/Tools/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = "$($tools.FullName)/bin/Hostx64/x64/dumpbin.exe"
          foreach ($binary in @('cloud-provider-sim.exe', 'game-ssh.exe')) {
            $imports = & $dumpbin /DEPENDENTS "target/${{ matrix.target }}/release/$binary"
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect $binary" }
            $imports | Write-Output
            if ($imports -match '(?i)(libgcc|libstdc\+\+|libwinpthread|vcruntime|msvcp|msvcr)[^\s]*\.dll') {
              throw "Unexpected runtime DLL dependency in $binary"
            }
          }
      - name: Smoke test Windows terminal client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/game-ssh.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Windows terminal client failed to start' }
      - name: Package executable, assets, and instructions
        run: >-
          python tools/package_game.py
          --executable target/${{ matrix.target }}/release/cloud-provider-sim${{ matrix.extension }}
          --terminal target/${{ matrix.target }}/release/game-ssh${{ matrix.extension }}
          --assets assets
          --readme README.md
          --output dist/cloud-provider-sim-${{ matrix.target }}.zip
      - name: Create SHA-256 checksum
        run: >-
          python -c "from pathlib import Path; import hashlib, sys; f=Path(sys.argv[1]); f.with_name(f.name+'.sha256').write_text(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.name}\\n', encoding='ascii')"
          dist/cloud-provider-sim-${{ matrix.target }}.zip
      - name: Upload shareable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: game-${{ matrix.target }}
          path: |
            dist/cloud-provider-sim-${{ matrix.target }}.zip
            dist/cloud-provider-sim-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Set up AWS CLI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AWS CLI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python -m pip install --disable-pip-version-check awscli
      - name: Upload game package to S3
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_RW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_RW_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$AWS_DEFAULT_REGION" || -z "$S3_BUCKET" || -z "$S3_ENDPOINT_URL" ]]; then
            echo 'Required S3 GitHub Actions secrets are missing.' >&2
            exit 1
          fi
          case "$S3_ENDPOINT_URL" in https://*) ;; *) echo 'S3_ENDPOINT_URL must use HTTPS.' >&2; exit 1 ;; esac
          package="cloud-provider-sim-${TARGET}.zip"
          for file in "$package" "$package.sha256"; do
            aws s3 cp "dist/$file" "s3://${S3_BUCKET}/resources/${file}" \
              --endpoint-url "$S3_ENDPOINT_URL" --region "$AWS_DEFAULT_REGION" \
              --cache-control 'public,max-age=0,must-revalidate' --only-show-errors --no-progress
          done
