name: Build game-ssh

on:
  push:
    branches: [main]
    tags: [game-ssh-v*]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - tools/smoke_game.py
      - tools/test_checks.py
      - crates/terminal/**
      - crates/sim/**
      - assets/equipment/**
      - tools/package_game_ssh.py
      - tools/test_package_game_ssh.py
      - docs/GAME_SSH.md
      - .github/workflows/build-game-ssh.yml
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - tools/smoke_game.py
      - tools/test_checks.py
      - crates/terminal/**
      - crates/sim/**
      - assets/equipment/**
      - tools/package_game_ssh.py
      - tools/test_package_game_ssh.py
      - docs/GAME_SSH.md
      - .github/workflows/build-game-ssh.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test client, simulation, and packaging
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo dependencies and tests
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ssh-test-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ssh-test-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
      - name: Check formatting, client/simulation lints, tests, and packaging
        run: make fmt-check lint test-rust test-tools CARGO_SCOPE='-p cloud-provider-sim -p game-ssh'

  build:
    name: Build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            extension: ""
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            extension: .exe
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo dependencies and release build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ssh-build-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ssh-build-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
      - name: Run native client tests
        run: cargo test --locked --target ${{ matrix.target }} -p game-ssh
      - name: Build release client
        run: cargo build --release --locked --target ${{ matrix.target }} -p game-ssh --bin game-ssh
      - name: Smoke test client startup
        run: target/${{ matrix.target }}/release/game-ssh${{ matrix.extension }} --help
      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw 'Visual Studio C++ tools were not found' }
          $tools = Get-ChildItem "$installation/VC/Tools/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = "$($tools.FullName)/bin/Hostx64/x64/dumpbin.exe"
          $imports = & $dumpbin /DEPENDENTS "target/${{ matrix.target }}/release/game-ssh.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect game-ssh.exe' }
          $imports | Write-Output
          if ($imports -match '(?i)(libgcc|libstdc\+\+|libwinpthread|vcruntime|msvcp|msvcr)[^\s]*\.dll') {
            throw 'Unexpected runtime DLL dependency in game-ssh.exe'
          }
      - name: Package client and instructions
        run: >-
          python tools/package_game_ssh.py
          --executable target/${{ matrix.target }}/release/game-ssh${{ matrix.extension }}
          --readme docs/GAME_SSH.md
          --output dist/game-ssh-${{ matrix.target }}.zip
      - name: Set up Python for AWS CLI
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/game-ssh-v')) && github.event_name != 'pull_request'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install AWS CLI
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/game-ssh-v')) && github.event_name != 'pull_request'
        run: python -m pip install --disable-pip-version-check awscli
      - name: Upload standalone client to S3
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/game-ssh-v')) && github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_RW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_RW_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$AWS_DEFAULT_REGION" || -z "$S3_BUCKET" || -z "$S3_ENDPOINT_URL" ]]; then
            echo 'Required S3 GitHub Actions secrets are missing.' >&2
            exit 1
          fi
          case "$S3_ENDPOINT_URL" in https://*) ;; *) echo 'S3_ENDPOINT_URL must use HTTPS.' >&2; exit 1 ;; esac
          package="game-ssh-${TARGET}.zip"
          for file in "$package" "$package.sha256"; do
            aws s3 cp "dist/$file" "s3://${S3_BUCKET}/downloads/versions/${GITHUB_SHA}/${file}" \
              --endpoint-url "$S3_ENDPOINT_URL" --region "$AWS_DEFAULT_REGION" \
              --cache-control 'public,max-age=31536000,immutable' --only-show-errors --no-progress
            aws s3 cp "dist/$file" "s3://${S3_BUCKET}/resources/${file}" \
              --endpoint-url "$S3_ENDPOINT_URL" --region "$AWS_DEFAULT_REGION" \
              --cache-control 'public,max-age=0,must-revalidate' --only-show-errors --no-progress
          done
      - name: Upload standalone client and checksum
        uses: actions/upload-artifact@v7
        with:
          name: game-ssh-${{ matrix.target }}
          path: |
            dist/game-ssh-${{ matrix.target }}.zip
            dist/game-ssh-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged client release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/game-ssh-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested client packages
        uses: actions/download-artifact@v8
        with:
          pattern: game-ssh-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "game-ssh $RELEASE_TAG" \
              --notes "Standalone Linux and Windows clients with SHA-256 checksums. Built from $GITHUB_SHA. See the included README for connection instructions."
          fi
