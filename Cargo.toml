[workspace]
resolver = "3"
members = ["crates/sim", "crates/game", "crates/terminal", "tools/texture-mapper"]
default-members = ["crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["default_app", "2d_bevy_render", "bevy_winit", "bevy_window", "x11", "png", "jpeg", "default_font", "multi_threaded"] }
bevy_egui = "0.42"
crossbeam-channel = "0.5"
ron = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Retain debug symbols/assertions while lightly optimizing workspace code.
[profile.dev]
opt-level = 1

# Compile the UI/rendering engine at production optimization levels.
# Unoptimized dependencies are costly on every redraw, including mouse
# motion and scrolling during `cargo run`.
[profile.dev.package."*"]
opt-level = 3
